[project]
name = "mediaflow"
version = "0.1.0"
description = "Desktop Media Downloader"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.8.0",
    "yt-dlp>=2025.1.0",
    "httpx[http2]>=0.28.0",
    "python-dotenv>=1.0.0",
    "cryptography>=50.0.1",
    "aiohttp>=3.14.3",
    "playwright>=1.63.0",
    "curl-cffi>=0.16.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "m3u8>=6.0.0",
    "mini-racer>=0.14.1",
    "tenacity>=9.2.1",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
mediaflow = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

